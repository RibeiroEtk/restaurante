spring:
  application:
    name: restaurante

  datasource:
    url: jdbc:h2:file:./data/restaurante
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  mvc:
    problemdetails:
      enabled: true

  web:
    error:
      include-message: always
      include-binding-errors: always

server:
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    use-root-path: true